<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <!-- Warm connections to the engine host and the item-data (Google Sheets) origin -->
  <link rel="preconnect" href="https://hellopavlo.github.io" />
  <link rel="preconnect" href="https://docs.google.com" crossorigin />
  <title>Garage Sale</title>
  <meta name="description" content="Browse and reserve items from our sale — furniture, electronics, appliances, and more." />
  <link rel="canonical" href="https://sale.hellopavlo.com/" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <!-- Engine styles: a static, render-blocking link (hosted in production) so the
       initial HTML paints already-styled and doesn't reflow into place (avoids CLS).
       The loader swaps it to the local copy on *.local hosts and injects the script. -->
  <link id="engine-css" rel="stylesheet" href="https://hellopavlo.github.io/sale-engine/engine/styles.css" />
  <link rel="stylesheet" href="data/theme.css" />
  <script>
    (function () {
      var HOSTED = "https://hellopavlo.github.io/sale-engine/engine/";
      var h = location.hostname;
      var dev = h === "localhost" || h === "127.0.0.1" || /\.local$/.test(h);
      if (dev) {
        var css = document.getElementById("engine-css");
        css.onerror = function () { css.onerror = null; console.warn("[engine] engine-local/styles.css not found — using hosted"); css.href = HOSTED + "styles.css"; };
        css.href = "engine-local/styles.css";
      }
      var s = document.createElement("script");
      s.src = (dev ? "engine-local/" : HOSTED) + "app.js";
      if (dev) s.onerror = function () { console.warn("[engine] engine-local/app.js not found — using hosted"); var f = document.createElement("script"); f.src = HOSTED + "app.js"; document.head.appendChild(f); };
      document.head.appendChild(s);
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1 id="sale-title">Garage Sale</h1>
      <p id="sale-subtitle" class="subtitle"></p>
      <p id="sale-contact" class="contact"></p>
    </div>
  </header>

  <noscript>
    <p style="text-align:center;padding:24px;">This sale listing needs JavaScript enabled to load items.</p>
  </noscript>

  <div class="controls-bar">
    <div class="wrap toolbar">
      <input id="search" class="search" type="search" placeholder="Search items…" autocomplete="off" aria-label="Search items" />

      <div class="cat-select">
        <button id="cat-toggle" class="cat-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="cat-menu">
          <span class="cat-btn-label">Categories</span>
          <span id="cat-count" class="cat-btn-count" hidden></span>
          <span class="cat-caret" aria-hidden="true"></span>
        </button>
        <div id="cat-menu" class="cat-menu" role="dialog" aria-label="Filter by category" hidden>
          <div class="cat-menu-head">
            <span class="cat-menu-title">Categories</span>
            <button id="cat-clear" type="button" class="cat-menu-clear">Clear</button>
          </div>
          <div id="cat-list" class="cat-list" role="group" aria-label="Categories"></div>
        </div>
        <div class="cat-backdrop" id="cat-backdrop" hidden></div>
      </div>

      <select id="sort" class="sort" aria-label="Sort items">
        <option value="price-desc">Price: high to low</option>
        <option value="price-asc">Price: low to high</option>
        <option value="name-asc">Name: A–Z</option>
      </select>

      <label class="toggle">
        <input type="checkbox" id="show-hidden" />
        <span class="toggle-track" aria-hidden="true"><span class="toggle-thumb"></span></span>
        <span class="toggle-label">Reserved &amp; sold</span>
      </label>
    </div>

    <div class="wrap active-filters" id="active-filters" hidden></div>
  </div>

  <p id="result-count" class="wrap result-count" aria-live="polite"></p>
  <main id="grid" class="wrap grid"></main>

</body>
</html>
